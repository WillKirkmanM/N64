[package]
name = "p64-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "p64_core"
path = "src/n64.rs"
crate-type = ["lib"]

[features]
default = ["native-gui"]
native-gui = ["p64-gui/native"]
headless = ["p64-gui/headless"]
accuracy-diagnostics = []
# Portable execution is always enabled.
portable = []

[dependencies]
p64-gui = { path = "../p64-gui", default-features = false }

bitflags = "2.6.0"
sha2 = "0.10"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
wide = "=1.7.1"
softfloat_pure = { git = "https://github.com/HarryR/softfloat-pure.git", rev = "f655f4c3119f6e8b05cf4790df705c6e54520611" }
serde_json = "1.0.133"
serde = { version = "1.0.215", features = ["derive"] }
tracing = "0.1.41"
governor = "0.7"
tracing-subscriber = "0.3.19"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4", features = ["clock"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
